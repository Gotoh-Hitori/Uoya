name: uoya-release-v1
services:
  app:
    build:
      context: .
      args:
        UOYA_BUILD_REVISION: ${UOYA_BUILD_REVISION:-unknown}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env.docker
        required: false
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      CHAT_API_PORT: 3001
      DATABASE_FILE: /app/server/social-chat/data/bluehaven.sqlite
      PERSONA_FILE: /app/server/social-chat/data/persona.md
    volumes:
      - app_data:/app/server/social-chat/data

  updater:
    profiles: [auto-update]
    build:
      context: .
      dockerfile: scripts/updater.Dockerfile
    restart: unless-stopped
    environment:
      UOYA_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-uoya-release-v1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deployment:ro
      - app_data:/data
      - update_work:/updates

volumes:
  app_data:
  update_work:
