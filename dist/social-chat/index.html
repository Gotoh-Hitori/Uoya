<!doctype html>
<html lang="zh-CN">
<head>
  <script src="/ui/browser-crypto.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f8ff" />
  <meta name="description" content="Uoya：一个 AI 与多个真人共处的实时聊天空间。" />
  <title>Uoya · AI 共享聊天室</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
  <link rel="stylesheet" href="/ui/admin-panels.css">
  <link rel="stylesheet" href="/ui/uoya-surface.css" data-uoya-surfaces>
  <script defer src="/ui/react-bits-adapter.js"></script>
<link rel="stylesheet" href="/ui/icons.css">
<script src="/ui/icons.js"></script>
<link rel="stylesheet" href="/ui/select.css">
<script defer src="/ui/select.js"></script>
</head>
<body>
  <div class="ambient-glow glow-a"></div>
  <div class="ambient-glow glow-b"></div>
  <div class="app-shell" id="appShell">
<main class="chat-panel">
      <header class="chat-header">
        <div class="chat-heading"><div class="header-channel-icon">#</div><div><div class="headline-row"><h1>共享客厅</h1></div></div></div>
        <div class="header-utility"><button type="button" id="adminConsoleOpen" class="small-button hidden">控制台</button>      <button class="account-card" id="accountMenu" type="button"><div class="account-avatar" id="myAvatar">访</div><span><strong id="myDisplay">访客</strong><small id="myRole">尚未登录</small></span><span class="account-arrow">•••</span></button>
      <div class="account-popover hidden" id="accountPopover"><button type="button" id="myProfileOpen">我的昵称和头像</button><button type="button" id="groupManage" class="hidden">群聊管理</button><button type="button" id="joinManage" class="hidden">入群管理</button><button type="button" id="personaManage" class="hidden">编辑 AI 人格</button><label class="account-voice"><input type="checkbox" id="autoSpeak"> 自动朗读</label><label class="account-voice"><input type="checkbox" id="preferServerTts" disabled> 增强语音</label><button type="button" id="logoutButton">退出登录</button></div></div>
      </header>
      <div class="chat-scroll" id="chatScroll">
        <div class="history-actions"><button id="loadMore" class="small-button hidden">加载更早消息</button></div>
        <div id="messages" class="messages" aria-live="polite" aria-relevant="additions"></div>
        <div id="typing" class="typing-line hidden"><div class="mini-ai-icon">✳</div><span class="typing-copy"><b id="typingName">AI</b> 正在思考<span class="typing-dots"><i></i><i></i><i></i></span></span></div>
        <div id="streaming" class="stream-bubble hidden"><div class="mini-ai-icon">✳</div><div><span class="stream-name">AI · 正在回复</span><p id="streamText"></p></div></div>
      </div>
      <div class="composer-area"><div id="mediaDrafts" class="uoya-media-drafts" hidden></div><form id="composer" class="composer"><textarea id="messageInput" rows="2" maxlength="2000" placeholder="和大家说点什么…" aria-label="发送到共享客厅"></textarea><div class="compose-controls"><button type="button" class="small-button" id="mediaAttach" aria-label="上传图片或视频">＋</button><button type="submit" class="send-button" id="sendButton" title="发送消息">发送 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h13m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></form></div>
    </main>

</div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="authOverlay">
    <section class="auth-modal" aria-label="登录或注册"><div class="auth-symbol">✳</div><div class="eyebrow">Uoya</div><h2>一起开始对话<span>。</span></h2><div class="auth-tabs"><button type="button" id="loginTab" class="selected">登录</button><button type="button" id="registerTab">加入空间</button></div><form id="authForm"><label>用户名<input id="authUsername" required autocomplete="username" minlength="3" maxlength="24" placeholder="3-24 位英文字母/数字" /></label><label id="displayNameGroup" class="hidden">显示昵称<input id="authDisplayName" maxlength="30" placeholder="大家怎么称呼你？" /></label><label>密码<input id="authPassword" type="password" required minlength="8" autocomplete="current-password" placeholder="至少 8 位" /></label><label id="joinQuestionGroup" class="hidden"><span id="joinQuestion"></span><input id="joinAnswer" maxlength="1000" autocomplete="off"></label><label id="joinNoteGroup" class="hidden">申请说明（可选）<input id="joinNote" maxlength="1000"></label><div class="auth-error" id="authError"></div><button type="submit" class="auth-submit" id="authSubmit">进入聊天室 <span>→</span></button></form></section>
  </div>
  <dialog id="personaDialog" class="persona-dialog"><form method="dialog" class="persona-editor"><div class="persona-head"><div><div class="eyebrow">AI PERSONALITY</div><h2>角色设定</h2></div><button value="cancel" class="dialog-close" aria-label="关闭">×</button></div><textarea id="personaText" spellcheck="false"></textarea><div class="dialog-actions"><span id="personaStatus"></span><button type="submit" class="small-button">取消</button><button type="button" id="savePersona" class="auth-submit">保存人格设定</button></div></form></dialog>
</body>
</html>
